openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: test
    description: Stress test operations
  - name: tokens
    description: Token queries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /test/start/{mode}:
    post:
      operationId: startTest
      tags: [test]
      summary: Start the stress test
      parameters:
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum: [SINGLE, DUAL, TRIPLE]
      responses:
        "200":
          description: Test started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestStarted"
        "400":
          description: Invalid mode or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /test/stop:
    post:
      operationId: stopTest
      tags: [test]
      summary: Stop the stress test
      responses:
        "200":
          description: Test stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestStopped"

  /test/status:
    get:
      operationId: getTestStatus
      tags: [test]
      summary: Get current test status
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestStatus"

  /test/report:
    get:
      operationId: getTestReport
      tags: [test]
      summary: Get final test report
      responses:
        "200":
          description: Test report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestReport"

  /test/reset-db:
    post:
      operationId: resetDb
      tags: [test]
      summary: Truncate all test data tables
      responses:
        "200":
          description: Tables truncated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "409":
          description: Cannot reset while test is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tokens/{provider}:
    get:
      operationId: getTokensByProvider
      tags: [tokens]
      summary: Get tokens assigned to a provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenRecord"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    OkResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]

    TestStarted:
      type: object
      properties:
        status:
          type: string
        mode:
          type: string
      required: [status, mode]

    TestStopped:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LatencyStats:
      type: object
      properties:
        best:
          type: number
        worst:
          type: number
        avg:
          type: number
        count:
          type: number
      required: [best, worst, avg, count]

    ProxyStatus:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        capacity:
          type: number
        subscriptions:
          type: number
        isStalled:
          type: boolean
        lastTradeAt:
          type: number
        connectedAt:
          type: number
      required: [id, name, version, capacity, subscriptions, isStalled, lastTradeAt, connectedAt]

    TestStatus:
      type: object
      properties:
        isRunning:
          type: boolean
        mode:
          type: string
          nullable: true
        totalTokens:
          type: number
        totalTrades:
          type: number
        uniqueWalletsCount:
          type: number
        testStartAt:
          type: number
        subscriptionsCount:
          type: number
        capacityLimit:
          type: number
        rotationCount:
          type: number
        testIsStalled:
          type: boolean
        testSubscriptions:
          type: number
        simultaneousStall:
          type: boolean
        proxies:
          type: array
          items:
            $ref: "#/components/schemas/ProxyStatus"
        reconnectStats:
          $ref: "#/components/schemas/LatencyStats"
        tradeResumeStats:
          $ref: "#/components/schemas/LatencyStats"
        logs:
          type: array
          items:
            type: string
      required:
        - isRunning
        - mode
        - totalTokens
        - totalTrades
        - uniqueWalletsCount
        - testStartAt
        - subscriptionsCount
        - capacityLimit
        - rotationCount
        - testIsStalled
        - testSubscriptions
        - simultaneousStall
        - proxies
        - reconnectStats
        - tradeResumeStats
        - logs

    TestReport:
      type: object
      properties:
        report:
          type: string
      required: [report]

    TokenRecord:
      type: object
      properties:
        mint:
          type: string
        provider1:
          type: string
        provider2:
          type: string
          nullable: true
      required: [mint, provider1]
